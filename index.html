<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>율포초 온라인 교무실</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap">
<style>
/* ───────── cap89 style tokens ───────── */
:root{
  --ink:#24324a;--muted:#667085;--primary:#3b63f6;--primary-hover:#254ed8;--sky:#38bdf8;--accent:#ffcf70;--secondary:#7fd8c9;--pink:#ff9fb5;
  --panel:rgba(255,255,255,.72);--panel-line:rgba(255,255,255,.95);--hairline:rgba(36,50,74,.07);
  --shadow:0 20px 60px rgba(67,89,146,.16);--shadow-sm:0 8px 24px rgba(50,68,110,.08);
  --r-xl:34px;--r-lg:26px;--r-md:16px;--r-sm:14px;--r-pill:999px;
  --font:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  /* Lucian --ux-* tokens mapped to the cap89 palette */
  color-scheme:light;
  --ux-page:#f8fbff;--ux-surface:#ffffff;--ux-surface-2:#f4f7ff;--ux-surface-3:#e8eefc;
  --ux-ink:#24324a;--ux-ink-2:#667085;--ux-ink-3:#98a2b3;
  --ux-line:rgba(36,50,74,.07);--ux-line-2:rgba(36,50,74,.15);
  --ux-accent:#3b63f6;--ux-accent-2:#38bdf8;--ux-accent-soft:rgba(59,99,246,.12);--ux-accent-ink:#ffffff;
  --ux-mint:#2bb39a;--ux-warn:#f59e0b;--ux-danger:#e5486b;
  --ux-glass:rgba(255,255,255,.72);--ux-glass-line:rgba(255,255,255,.95);
  --ux-shadow:rgba(67,89,146,.16);--ux-shadow-strong:rgba(67,89,146,.32);
  --ux-grad:linear-gradient(100deg,#3b63f6 0%,#38bdf8 52%,#f59e0b 100%);
  --ux-ease:cubic-bezier(.2,.8,.2,1);--ux-spring:cubic-bezier(.34,1.45,.64,1);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:var(--font);color:var(--ink);font-size:16px;line-height:1.7;word-break:keep-all;
  background:
    radial-gradient(circle at 12% 18%,rgba(255,207,112,.45),transparent 28%),
    radial-gradient(circle at 88% 14%,rgba(127,216,201,.45),transparent 30%),
    radial-gradient(circle at 75% 82%,rgba(255,159,181,.28),transparent 28%),
    linear-gradient(135deg,#f8fbff 0%,#fffdf7 45%,#f8fffc 100%);
  background-attachment:fixed;min-height:100vh;
}
a{color:var(--primary)}
button{font:inherit;color:inherit;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* Lucian .ux base */
.ux,.ux *,.ux *::before,.ux *::after{box-sizing:border-box}
.ux{font-family:var(--font);color:var(--ux-ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;-webkit-tap-highlight-color:transparent;word-break:keep-all;overflow-wrap:break-word}
:where(.ux) :is(button,input,textarea,select){font:inherit;color:inherit}
:where(.ux) button{cursor:pointer}
.ux :focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}
.ux [hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.ux,.ux *,.ux *::before,.ux *::after,.blob,.view{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}

/* decorative blobs */
.blob{position:fixed;z-index:0;border-radius:50%;filter:blur(40px);opacity:.55;pointer-events:none;animation:float 8s ease-in-out infinite}
.blob.b1{width:260px;height:260px;left:-60px;top:40%;background:#ffcf70}
.blob.b2{width:220px;height:220px;right:-40px;top:8%;background:#7fd8c9;animation-duration:9s}
.blob.b3{width:200px;height:200px;right:20%;bottom:-60px;background:#ff9fb5;animation-duration:7s}
@keyframes float{50%{transform:translate(10px,-18px)}}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ───────── app layout ───────── */
.app{position:relative;z-index:1;display:flex;gap:32px;width:85%;max-width:1680px;margin:0 auto;padding:18px 0;min-height:100vh}
.main{flex:1;min-width:0}
@media (max-width:1280px){.app{width:auto;padding:18px}}

/* ───────── Lucian #040 펼쳐지는 사이드 레일 (부서 메뉴) ───────── */
.u040{--rw:76px;position:sticky;top:18px;height:calc(100vh - 36px);flex:none;z-index:30}
.u040.is-wide{--rw:236px}
.u040-rail{position:relative;display:flex;flex-direction:column;height:100%;width:var(--rw);padding:12px 10px;border-radius:24px;background:var(--panel);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--panel-line);box-shadow:var(--shadow);color:var(--ink);overflow:hidden;transition:width .6s var(--ux-spring)}
.u040-top{display:flex;align-items:center;gap:10px;height:44px;margin-bottom:10px;flex:none}
.u040-logo{width:36px;height:36px;flex:none;margin-left:10px;border-radius:12px;background:linear-gradient(135deg,#3b63f6,#8e9cff);box-shadow:0 10px 25px rgba(59,99,246,.28);display:grid;place-items:center;color:#fff;font-size:16px;font-weight:800}
.u040-name{font-size:15.5px;font-weight:780;letter-spacing:-.03em;white-space:nowrap;opacity:0;transition:opacity .25s;line-height:1.2}
.u040-name small{display:block;font-size:11px;font-weight:600;opacity:.6}
.u040.is-wide .u040-name{opacity:1;transition:opacity .3s .15s}
.u040-tog{position:absolute;right:-1px;top:16px;width:30px;height:36px;border:0;padding:0;border-radius:10px 0 0 10px;background:var(--ux-surface-2);color:var(--muted);display:grid;place-items:center;opacity:0;transition:opacity .2s;z-index:2}
.u040-rail:hover .u040-tog,.u040-tog:focus-visible,.u040.is-wide .u040-tog{opacity:1}
@media (hover:none){.u040-tog{opacity:1}}
.u040-tog:focus-visible{outline:2px solid var(--ux-accent);outline-offset:-2px}
.u040-tog svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .5s var(--ux-spring)}
.u040.is-wide .u040-tog svg{transform:rotate(180deg)}
.u040-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;margin:0 -4px;padding:0 4px 70px}
.u040-scroll::-webkit-scrollbar{display:none}
.u040-nav{position:relative;margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.u040-hl{position:absolute;left:0;right:0;top:0;height:48px;border-radius:15px;background:var(--ux-accent-soft);transform:translateY(var(--y,0));transition:transform .5s var(--ux-spring);pointer-events:none}
.u040-hl::before{content:"";position:absolute;left:-10px;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--ux-grad)}
.u040-gt{display:flex;align-items:center;gap:8px;width:100%;height:34px;margin-top:6px;padding:0 12px 0 18px;border:0;border-radius:11px;background:none;font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--ux-ink-3);white-space:nowrap;overflow:hidden;text-align:left;transition:background .2s,color .2s}
.u040-gt:hover{color:var(--ink);background:var(--ux-surface-2)}
.u040-gt:focus-visible{outline:2px solid var(--ux-accent);outline-offset:-2px}
.u040-gt em{font-style:normal;font-weight:700;letter-spacing:0;opacity:0;transform:translateX(-4px);transition:opacity .25s,transform .35s var(--ux-spring)}
.u040-gt[aria-expanded="false"] em{opacity:1;transform:none}
.u040-gt svg{margin-left:auto;width:12px;height:12px;flex:none;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .45s var(--ux-spring)}
.u040-gt[aria-expanded="false"] svg{transform:rotate(-90deg)}
.u040-gw{display:grid;grid-template-rows:1fr;transition:grid-template-rows .45s var(--ux-ease)}
.u040-gw.shut{grid-template-rows:0fr}
.u040-gw>ul{min-height:0;overflow:hidden;margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.u040-gw>ul>li{transition:opacity .3s,transform .4s var(--ux-spring)}
.u040-gw.shut>ul>li{opacity:0;transform:translateY(-6px)}
.u040:not(.is-wide) .u040-gt{height:14px;margin:7px 12px 0;padding:0;border-top:1px solid var(--hairline);border-radius:0;pointer-events:none}
.u040:not(.is-wide) .u040-gt>*{display:none}
.u040:not(.is-wide) .u040-gw{grid-template-rows:1fr}
.u040:not(.is-wide) .u040-gw>ul>li{opacity:1;transform:none}
.u040-hl.off{opacity:0}
.u040-it.u040-add{margin-top:8px;opacity:1;color:var(--primary);border:1.5px dashed rgba(59,99,246,.3)}
.u040-it.u040-add:hover{background:var(--ux-accent-soft);border-style:solid;border-color:transparent}
.u040-me .adm{display:inline-block;margin-left:5px;padding:0 6px;border-radius:6px;background:var(--primary);color:#fff;font-size:10px;font-weight:800;vertical-align:1px}
/* 관리자 · 부서 만들기 폼 */
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emojis label{position:relative}
.emojis input{position:absolute;opacity:0;inset:0}
.emojis span{display:grid;place-items:center;height:40px;border-radius:12px;background:var(--ux-surface-2);font-size:20px;cursor:pointer;transition:transform .3s var(--ux-spring),box-shadow .2s,background .2s}
.emojis span:hover{transform:scale(1.08)}
.emojis input:checked+span{background:var(--ux-accent-soft);box-shadow:inset 0 0 0 2px var(--primary);transform:scale(1.08)}
.emojis input:focus-visible+span{outline:2px solid var(--primary);outline-offset:2px}
.adm-box{margin-top:22px;padding:16px;border-radius:18px;background:var(--ux-surface-2);box-shadow:inset 0 0 0 1px var(--ux-line)}
.adm-box h5{margin:0 0 4px!important;font-size:14px!important;color:var(--ink)!important}
.adm-box p{margin:0;font-size:13px;color:var(--muted);line-height:1.5}
.adm-row{display:flex;gap:8px;margin-top:12px}
.adm-row .inp{flex:1}
.adm-row.shake{animation:u062-no .5s cubic-bezier(.36,.07,.19,.97)}
.pin-ed{margin-top:12px;padding:12px;border-radius:16px;background:var(--ux-surface-2);box-shadow:inset 0 0 0 1px var(--ux-line);display:flex;flex-direction:column;gap:8px}
.pin-top{display:flex;align-items:center;gap:6px}
.pin-ed .inp{height:42px;background:#fff;font-size:14.5px}
.pin-ed .pin-ic{flex:none;width:64px;padding:0 8px;font-size:18px;background-image:none;text-align:center}
.pin-ed .pin-nm{flex:1;min-width:0;font-weight:700}
.pin-ed .ibtn{width:32px;height:32px;font-size:12px}
.pin-ed .ibtn:disabled{opacity:.3;cursor:default}
.rail-pv{display:flex;align-items:center;gap:14px;height:48px;padding:0 14px;border-radius:15px;background:var(--ux-accent-soft);color:var(--primary);font-weight:700}
.rail-pv .ic{font-size:18px}
.rail-pv em{margin-left:auto;font-style:normal;font-size:11px;padding:1px 7px;border-radius:9px;background:var(--primary);color:#fff}
.u040-it{position:relative;display:flex;align-items:center;gap:14px;width:100%;height:48px;padding:0 0 0 16px;border:0;border-radius:15px;background:none;color:var(--ink);opacity:.78;text-align:left;transition:opacity .25s,color .25s}
.u040-it:hover{opacity:1}
.u040-it[aria-current="page"]{opacity:1;color:var(--primary)}
.u040-it[aria-current="page"] span{font-weight:750}
.u040-it:focus-visible{outline:2px solid var(--ux-accent);outline-offset:-2px}
.u040-it .ic{width:22px;flex:none;font-size:18px;text-align:center;line-height:1}
.u040-it span{font-size:14.5px;font-weight:650;white-space:nowrap;opacity:0;transform:translateX(-8px);transition:opacity .2s,transform .35s var(--ux-ease)}
.u040.is-wide .u040-it span{opacity:1;transform:none;transition:opacity .3s var(--ux-ease),transform .5s var(--ux-spring);transition-delay:calc(.12s + var(--i) * 25ms)}
.u040-bd{position:absolute;left:34px;top:9px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--ux-surface-3);color:var(--ux-ink-2);font-size:10.5px;font-weight:800;display:grid;place-items:center;font-style:normal;box-shadow:0 0 0 2.5px #fff;transition:left .5s var(--ux-spring)}
.u040-bd.hot{background:#FF5A6E;color:#fff}
.u040-it[aria-current="page"] .u040-bd{background:var(--primary);color:#fff}
.u040.is-wide .u040-bd{left:196px;top:15.5px}
.u040-me{position:absolute;left:10px;right:10px;bottom:12px;display:flex;align-items:center;gap:10px;height:52px;padding:0 0 0 10px;border-radius:16px;background:#fff;border:1px solid var(--hairline);box-shadow:0 -12px 20px 6px rgba(255,255,255,.9),var(--shadow-sm);color:var(--ink);text-align:left}
.u040-me i{width:34px;height:34px;flex:none;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE2C2,#ffcf70 45%,#3b63f6);display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:800;color:#fff}
.u040-me span{font-size:13px;font-weight:650;white-space:nowrap;opacity:0;transition:opacity .25s;line-height:1.35}
.u040-me small{display:block;font-size:11.5px;color:var(--muted)}
.u040.is-wide .u040-me span{opacity:1;transition-delay:.25s}
.scrim{position:fixed;inset:0;z-index:25;background:rgba(20,28,45,.28);opacity:0;pointer-events:none;transition:opacity .3s}

/* ───────── top bar ───────── */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;height:76px;padding:10px 0}
#addBtn{margin-left:auto}
.menu-btn{display:none;width:46px;height:46px;border:0;border-radius:var(--r-md);background:var(--panel);backdrop-filter:blur(10px);box-shadow:var(--shadow-sm);font-size:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:46px;padding:0 20px;border:0;border-radius:var(--r-pill);font-size:15px;font-weight:650;white-space:nowrap;transition:background .2s,transform .2s var(--ux-spring),box-shadow .2s}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 10px 24px -10px rgba(59,99,246,.7)}
.btn-primary:hover{background:var(--primary-hover)}
.btn-primary:disabled{background:#b8c3dc;box-shadow:none;cursor:not-allowed}
.btn-ghost{background:rgba(255,255,255,.78);color:var(--primary);border:1px solid rgba(59,99,246,.14);backdrop-filter:blur(10px)}
.btn-ghost:hover{background:#fff}
.btn:focus-visible{outline:2px solid var(--primary);outline-offset:3px}

/* ───────── Lucian #046 커맨드 팔레트 (통합 검색) ───────── */
.u046{position:relative;flex:1;max-width:560px;height:56px}
.u046-pal{position:absolute;left:0;right:0;top:0;height:460px;display:flex;flex-direction:column;border-radius:24px;background:var(--ux-surface);box-shadow:0 0 0 1px var(--ux-line),0 34px 60px -34px var(--ux-shadow-strong);clip-path:inset(0 0 0 0 round 24px);transition:clip-path .6s var(--ux-ease),box-shadow .5s}
.u046.is-closed .u046-pal{clip-path:inset(0 0 calc(100% - 56px) 0 round 28px);box-shadow:0 0 0 1px var(--ux-line-2),0 14px 26px -18px var(--ux-shadow-strong);transition:clip-path .5s var(--ux-ease),box-shadow .5s}
.u046-field{position:relative;display:flex;align-items:center;gap:10px;height:56px;flex:none;padding:0 14px 0 18px;border-bottom:1px solid var(--ux-line);cursor:text;transition:border-color .3s}
.u046.is-closed .u046-field{border-color:transparent;cursor:pointer}
.u046-field svg{width:19px;height:19px;flex:none;fill:none;stroke:var(--ux-ink-3);stroke-width:2;stroke-linecap:round}
.u046-in{flex:1;min-width:0;height:100%;border:0;padding:0;background:none;font:inherit;font-size:15.5px;font-weight:560;color:var(--ux-ink);outline:none}
.u046-in:focus-visible{outline:none}
.u046-in::placeholder{color:var(--ux-ink-3)}
.u046-kbd{display:inline-flex;align-items:center;height:24px;padding:0 7px;border-radius:7px;background:var(--ux-surface-2);box-shadow:inset 0 -1px 0 var(--ux-line-2);font-size:11.5px;font-weight:700;color:var(--ux-ink-3);font-family:inherit;white-space:nowrap}
.u046-field:has(.u046-in:focus-visible){box-shadow:inset 0 -2px 0 var(--ux-accent)}
.u046-body{position:relative;flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;overscroll-behavior:contain;padding:6px 8px;transition:opacity .3s}
.u046-body::-webkit-scrollbar{display:none}
.u046.is-closed .u046-body,.u046.is-closed .u046-foot{opacity:0;pointer-events:none}
.u046-hl{position:absolute;left:8px;right:8px;top:0;height:46px;border-radius:13px;background:var(--ux-accent-soft);box-shadow:inset 3px 0 0 var(--ux-accent);transform:translateY(var(--y,0));transition:transform .4s var(--ux-spring),opacity .2s;pointer-events:none}
.u046-list{position:relative;margin:0;padding:0;list-style:none}
.u046-g{padding:10px 10px 6px;font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--ux-ink-3)}
.u046-op{display:flex;align-items:center;gap:12px;height:46px;padding:0 10px;border-radius:13px;font-size:14.5px;font-weight:620;color:var(--ux-ink-2);cursor:pointer;animation:u046-in .45s var(--ux-spring) backwards;animation-delay:calc(var(--i) * 28ms)}
.u046-op>span:nth-child(2){flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u046-op[aria-selected="true"]{color:var(--ux-ink)}
.u046-op mark{background:none;color:var(--ux-accent);font-weight:800}
.u046-ic{width:28px;height:28px;flex:none;border-radius:9px;display:grid;place-items:center;background:var(--c,var(--ux-surface-2));color:#fff;font-size:14px}
.u046-op small{flex:none;font-size:12px;font-weight:650;color:var(--ux-ink-3)}
.u046-op .u046-kbd{margin-left:auto}
.u046-empty{padding:40px 0;text-align:center;font-size:14px;color:var(--ux-ink-3)}
.u046-empty b{display:block;margin-bottom:4px;font-size:15px;color:var(--ux-ink)}
@keyframes u046-in{from{opacity:0;transform:translateY(8px)}}
.u046-foot{display:flex;align-items:center;gap:14px;height:44px;flex:none;padding:0 16px;border-top:1px solid var(--ux-line);font-size:12px;font-weight:600;color:var(--ux-ink-3);transition:opacity .3s}
.u046-foot .u046-kbd{height:20px;padding:0 5px;margin-right:4px;font-size:11px}

/* ───────── views ───────── */
.view{animation:pageIn .5s var(--ux-ease)}
.demo-bar{display:flex;align-items:center;gap:10px;margin:0 0 14px;padding:10px 16px;border-radius:var(--r-md);background:rgba(255,207,112,.25);border:1px solid rgba(245,158,11,.3);font-size:13.5px;color:#8a5a00}
.eyebrow{display:inline-flex;align-items:center;gap:6px;padding:10px 15px;border-radius:var(--r-pill);background:rgba(255,255,255,.78);backdrop-filter:blur(10px);border:1px solid rgba(59,99,246,.14);color:var(--primary);font-size:14px;font-weight:750;box-shadow:var(--shadow-sm);line-height:1}
.hero{padding:22px 4px 8px}
.hero h1{margin:14px 0 6px;font-size:clamp(22px,2.7vw,32px);line-height:1.3;font-weight:850;letter-spacing:-.028em}
@media (min-width:1100px){.hero h1,.hero p{white-space:nowrap}}
.grad{background:linear-gradient(100deg,#3b63f6 0%,#38bdf8 52%,#f59e0b 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;color:var(--muted);font-size:15px}
.notice{display:flex;align-items:center;gap:10px;margin:18px 0 0;padding:12px 18px;border-radius:var(--r-md);background:var(--panel);backdrop-filter:blur(20px);border:1px solid var(--panel-line);box-shadow:var(--shadow-sm);font-size:14.5px}
.notice b{color:var(--primary)}
.notice>span{flex:1;min-width:0}
.notice.off{opacity:.6;border-style:dashed}
.notice .pen{flex:none;width:36px;height:36px;margin:-6px -8px -6px 0;border:0;border-radius:11px;display:grid;place-items:center;background:var(--ux-accent-soft);color:var(--primary);font-size:16px;transition:transform .3s var(--ux-spring),background .2s}
.notice .pen:hover{transform:rotate(-12deg) scale(1.1);background:rgba(59,99,246,.2)}
.notice .pen:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.notice.editing{flex-wrap:wrap;box-shadow:0 0 0 2px var(--primary),var(--shadow-sm)}
.notice .ned{flex:1;min-width:200px;height:40px;padding:0 12px;border:0;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--ux-line-2);font:inherit;font-size:14.5px;color:var(--ink);outline:none}
.notice .ned:focus{box-shadow:inset 0 0 0 2px var(--primary)}
.notice .nacts{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.notice .nacts .btn{height:38px;padding:0 14px;font-size:14px}
.sw{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:650;color:var(--muted);cursor:pointer;user-select:none}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw i{position:relative;width:38px;height:22px;border-radius:11px;background:var(--ux-surface-3);transition:background .25s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .35s var(--ux-spring)}
.sw input:checked+i{background:var(--ux-mint)}
.sw input:checked+i::after{transform:translateX(16px)}
.sw input:focus-visible+i{outline:2px solid var(--primary);outline-offset:2px}
.sec{margin-top:34px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px}

.sec-head h2{margin:2px 0 0;font-size:22px;font-weight:750;letter-spacing:-.02em;line-height:1.3}

.glass{background:var(--panel);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--panel-line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.pins{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pin{display:flex;align-items:center;gap:12px;padding:16px 18px;border-radius:var(--r-md);background:rgba(255,255,255,.78);border:1px solid var(--hairline);text-decoration:none;color:var(--ink);transition:.2s;box-shadow:var(--shadow-sm)}

.pin .em{font-size:24px}
.pin b{display:block;font-size:15px;line-height:1.3}
.pin small{color:var(--muted);font-size:12.5px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.mini{display:inline-flex;align-items:center;gap:8px;max-width:100%;padding:9px 14px;border-radius:var(--r-sm);background:rgba(255,255,255,.78);border:1px solid var(--hairline);font-size:14px;font-weight:600;color:var(--ink);transition:.2s}
.mini:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm)}
.mini span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.empty-hint{padding:16px 18px;border-radius:var(--r-md);border:1.5px dashed rgba(59,99,246,.2);color:var(--muted);font-size:14px}
.depts{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.dept{display:flex;flex-direction:column;gap:10px;padding:20px;text-align:left;border:1px solid var(--panel-line);transition:.2s}

.dept-h{display:flex;align-items:center;gap:12px}

/* department page */

.dhead{display:flex;align-items:center;gap:16px;margin:14px 0 6px}

/* ───────── Lucian #044 아코디언 (카테고리 묶음) ───────── */
.u044{position:relative;display:flex;flex-direction:column;gap:10px}
.u044-it{position:relative;border-radius:20px;background:var(--ux-surface);box-shadow:0 0 0 1px var(--ux-line);transition:background-color .4s var(--ux-ease),box-shadow .5s var(--ux-ease),transform .5s var(--ux-spring)}

.u044-q{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:0 14px 0 18px;border:0;border-radius:20px;background:none;font-size:16px;font-weight:700;letter-spacing:-.02em;color:var(--ux-ink);text-align:left}

.u044-n{font-size:12px;font-weight:800;color:var(--ux-ink-3);font-variant-numeric:tabular-nums;transition:color .3s}

.u044-t{flex:1}
.u044-t em{margin-left:8px;font-style:normal;font-size:12.5px;font-weight:700;color:var(--ux-ink-3)}
.u044-t .peek{display:block;font-size:12.5px;font-weight:550;color:var(--ux-ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60ch;transition:opacity .25s}
.u044-it.open .peek{opacity:0;height:0}
.u044-t{min-width:0;padding:10px 0}
.more{display:block;width:100%;margin-top:6px;height:40px;border:1.5px dashed var(--ux-line-2);border-radius:12px;background:none;font-size:13.5px;font-weight:700;color:var(--primary)}
.more:hover{background:var(--ux-accent-soft);border-style:solid;border-color:transparent}
.u044-pm{position:relative;width:30px;height:30px;flex:none;border-radius:50%;background:var(--ux-surface-2);transition:background-color .35s var(--ux-ease),transform .45s var(--ux-spring)}
.u044-q:hover .u044-pm{transform:scale(1.1)}
.u044-q:active .u044-pm{transform:scale(.9)}
.u044-pm::before,.u044-pm::after{content:"";position:absolute;left:50%;top:50%;width:11px;height:2px;margin:-1px 0 0 -5.5px;border-radius:2px;background:var(--ux-ink);transition:transform .5s var(--ux-spring),background-color .3s}
.u044-pm::after{transform:rotate(90deg)}
.u044-it.open .u044-pm{background:var(--primary)}
.u044-it.open .u044-pm::before,.u044-it.open .u044-pm::after{background:var(--ux-page)}
.u044-it.open .u044-pm::after{transform:rotate(180deg)}
.u044-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--ux-ease)}
.u044-it.open .u044-body{grid-template-rows:1fr}
.u044-body>div{overflow:hidden;min-height:0}
.u044-a{padding:0 12px 12px 12px;opacity:0;transform:translateY(-8px);transition:opacity .25s var(--ux-ease),transform .45s var(--ux-spring)}
.u044-it.open .u044-a{opacity:1;transform:none;transition-delay:.12s}

/* link rows inside a category */
.rows{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.row{display:flex;align-items:center;gap:12px;padding:8px 8px 8px 10px;border-radius:14px;transition:background .2s,box-shadow .2s}

.row.is-on{background:color-mix(in srgb,var(--ux-accent) 10%,transparent);box-shadow:inset 3px 0 0 var(--ux-accent)}
.ticon{width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:17px;background:var(--tc,var(--ux-surface-2))}
.row-main{flex:1;min-width:0;padding:0;border:0;background:none;text-align:left}

.who{flex:none;display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px 3px;border-radius:var(--r-pill);background:var(--ux-surface-2);font-size:12px;font-weight:650;color:var(--ux-ink-2)}

.ibtn{width:36px;height:36px;flex:none;border:0;border-radius:11px;display:grid;place-items:center;background:none;color:var(--ux-ink-3);font-size:17px;text-decoration:none;transition:background .2s,color .2s,transform .3s var(--ux-spring)}

.ibtn:focus-visible{outline:2px solid var(--ux-accent);outline-offset:1px}
/* card grid view */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{display:flex;flex-direction:column;border-radius:var(--r-lg);overflow:hidden;background:rgba(255,255,255,.85);border:1px solid var(--hairline);box-shadow:var(--shadow-sm);transition:.2s;text-align:left}

footer{margin:56px 0 24px;text-align:center;font-size:13px;color:var(--muted)}

/* ───────── Lucian #273 상세 옆 패널 (페이지 상세 · 등록) ───────── */
.u273{position:fixed;inset:0;z-index:60;pointer-events:none}

/* add form inside the panel */
.fld{margin-top:14px}
.fld>label,.lb{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;font-size:13px;font-weight:750;color:var(--ux-ink-2)}

.inp{display:block;width:100%;height:48px;padding:0 14px;border:0;border-radius:14px;background:var(--ux-surface-2);box-shadow:inset 0 0 0 1.5px var(--ux-line);font-size:15px;font-weight:600;color:var(--ux-ink);outline:none;transition:box-shadow .2s,background .2s}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.auto{display:inline-flex;align-items:center;gap:4px;margin-left:6px;padding:1px 7px;border-radius:6px;background:rgba(43,179,154,.14);color:#0f766e;font-size:10.5px;font-weight:800;vertical-align:1px}

/* Lucian #249 쓰는 대로 보이는 미리보기 막대 */

/* ───────── Lucian #062 로그인 카드 피드백 (교직원 인증) ───────── */
.gate{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:16px;background:rgba(248,251,255,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:opacity .5s}

.u062{position:relative;width:360px;max-width:100%;height:500px;border-radius:30px;background:var(--ux-surface);box-shadow:0 0 0 1px var(--ux-line),0 30px 60px -36px var(--ux-shadow-strong);overflow:hidden}
.u062.shake{animation:u062-no .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes u062-no{15%{transform:translateX(-9px) rotate(-.6deg)}30%{transform:translateX(8px) rotate(.5deg)}45%{transform:translateX(-6px)}60%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
.u062-pane{position:absolute;inset:0;padding:30px 26px 26px;display:flex;flex-direction:column;transition:transform .6s var(--ux-ease),opacity .4s}
.u062-logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#3b63f6,#8e9cff);box-shadow:0 10px 25px rgba(59,99,246,.28);display:grid;place-items:center;color:#fff;font-weight:800;font-size:19px}
.u062-pane h3{margin:18px 0 4px;font-size:24px;font-weight:850;letter-spacing:-.045em;line-height:1.3}
.u062-pane>p{margin:0 0 20px;font-size:13.5px;color:var(--ux-ink-3);line-height:1.5}
.u062-f{position:relative;margin-bottom:12px}
.u062-f label{display:block;margin-bottom:6px;font-size:12.5px;font-weight:700;color:var(--ux-ink-2)}
.u062-f label em{font-style:normal;font-weight:600;color:var(--ux-ink-3)}
.u062-box{position:relative;display:flex;align-items:center;height:52px;border-radius:15px;background:var(--ux-surface-2);box-shadow:inset 0 0 0 1.5px transparent;transition:box-shadow .25s,background-color .25s}
.u062-box:focus-within{background:var(--ux-surface);box-shadow:inset 0 0 0 1.5px var(--ux-accent),0 0 0 4px var(--ux-accent-soft)}
.u062-f.bad .u062-box{box-shadow:inset 0 0 0 1.5px var(--ux-danger);background:color-mix(in srgb,var(--ux-danger) 6%,var(--ux-surface))}
.u062-box input{flex:1;min-width:0;height:100%;border:0;padding:0 16px;background:none;font-size:15px;font-weight:600;color:var(--ux-ink);outline:none}
.u062-box input::placeholder{color:var(--ux-ink-3);font-weight:500}
.u062-eye{width:44px;height:44px;margin-right:4px;border:0;padding:0;border-radius:12px;display:grid;place-items:center;background:none;color:var(--ux-ink-3);transition:color .2s}
.u062-eye:hover{color:var(--ux-ink)}
.u062-eye svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.u062-lid{transform-origin:12px 12px;transition:transform .35s var(--ux-spring)}
.u062-eye[aria-pressed="false"] .u062-lid{transform:scaleY(.5)}
.u062-slash{stroke-dasharray:24;stroke-dashoffset:0;transition:stroke-dashoffset .35s var(--ux-ease)}
.u062-eye[aria-pressed="true"] .u062-slash{stroke-dashoffset:24}
.u062-caps{position:absolute;right:0;top:0;font-size:11.5px;font-weight:800;color:var(--ux-warn);opacity:0;transition:opacity .2s}

.u062-err{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s var(--ux-ease)}
.u062-err>span{overflow:hidden;min-height:0;font-size:12.5px;font-weight:650;color:var(--ux-danger)}
.u062-err>span::before{content:"";display:block;height:7px}
.u062-f.bad .u062-err{grid-template-rows:1fr}
.u062-go{position:relative;align-self:center;width:100%;height:54px;margin-top:auto;border:0;border-radius:17px;background:var(--primary);color:#fff;font-size:15.5px;font-weight:760;overflow:hidden;transition:width .45s var(--ux-spring),border-radius .45s var(--ux-spring),background-color .4s,transform .3s var(--ux-spring)}
.u062-go:active{transform:scale(.97)}
.u062-go:focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}

};

function deptOf(n){for(var i=0;i<DEPTS.length;i++)if(DEPTS[i].n===n)return DEPTS[i];return{n:n,e:'📌',c:'#eef1f6',g:'기타'}}

/* ═════════════════ 링크 정규화 · 중복 판별 ═════════════════
   같은 문서라도 /edit, /view, ?usp=sharing 등 주소가 달라질 수 있어 "문서 고유 ID" 기준으로 비교합니다. */
function normKey(u){
  u=(u||'').trim(); if(!u) return ''; var m;
  if(m=u.match(/\/macros\/(?:[^/]+\/)?s\/([A-Za-z0-9_-]{20,})/)) return 'gas:'+m[1];
  if(m=u.match(/\/d\/(?:e\/)?([A-Za-z0-9_-]{15,})/)) return 'g:'+m[1];
  if(m=u.match(/[?&]id=([A-Za-z0-9_-]{15,})/)) return 'g:'+m[1];
  if(m=u.match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/)([A-Za-z0-9_-]{11})/)) return 'yt:'+m[1];
  try{var x=new URL(u);return 'u:'+x.hostname.replace(/^www\./,'').toLowerCase()+x.pathname.replace(/\/+$/,'')}catch(e){return 'u:'+u.toLowerCase()}
}
function hashKey(k){
  if(!k) return Promise.resolve('');
  return crypto.subtle.digest('SHA-256',new TextEncoder().encode(k)).then(function(b){
    return Array.prototype.slice.call(new Uint8Array(b),0,6).map(function(x){return x.toString(16).padStart(2,'0')}).join('');
  });
}
/* 붙여 넣은 주소로 유형 자동 판별 */
function detectType(u){
  u=(u||'').toLowerCase();
  if(/docs\.google\.com\/spreadsheets/.test(u)) return 'sheet';
  if(/docs\.google\.com\/document/.test(u)) return 'doc';
  if(/docs\.google\.com\/presentation/.test(u)) return 'slide';
  if(/docs\.google\.com\/forms|forms\.gle/.test(u)) return 'form';
  if(/drive\.google\.com/.test(u)) return 'drive';
  if(/script\.google\.com/.test(u)) return 'app';
  if(/youtube\.com|youtu\.be/.test(u)) return 'video';
  if(/notion\.(so|site)/.test(u)) return 'notion';
  if(/chatgpt\.com\/g\/|gemini\.google|gpts?\b/.test(u)) return 'ai';
  return 'web';
}
function dupGroups(){
  var m={},out=[];
  S.apps.forEach(function(a){if(!a.hash)return;(m[a.hash]=m[a.hash]||[]).push(a)});
  for(var k in m) if(m[k].length>1) out.push(m[k]);
  return out;
}


/* 폼 제출: 미리보기처럼 폼 전송이 막힌 환경에서도 동작하도록
   제출 버튼 클릭과 입력칸의 Enter를 직접 처리합니다 (submit 이벤트는 보조) */
function onSubmit(form,fn){
  var busy=false;
  function run(e){if(e&&e.preventDefault)e.preventDefault();if(busy)return;busy=true;setTimeout(function(){busy=false},0);fn(e||{preventDefault:function(){}})}
  form.addEventListener('submit',run);
  form.addEventListener('click',function(e){var b=e.target.closest('button[type=submit]');if(b&&form.contains(b)){e.preventDefault();if(!b.disabled)run(e)}});
  form.addEventListener('keydown',function(e){
    var t=e.target;
    if(e.key!=='Enter'||e.isComposing||e.keyCode===229||e.defaultPrevented) return;
    if(t.tagName==='TEXTAREA'||t.tagName==='BUTTON'||t.tagName==='SELECT') return;
    if(t.tagName==='INPUT'&&/^(radio|checkbox)$/.test(t.type)) return;
    var b=form.querySelector('button[type=submit]');
    e.preventDefault(); if(!b||!b.disabled) run(e);
  });
}

    el.querySelector('b').textContent=title;el.querySelector('small').textContent=sub||'';
    var t={el:el,left:DUR};zone.appendChild(el);list.unshift(t);void el.offsetWidth;el.classList.remove('enter');layout();live.textContent=title;
    el.querySelector('.u070-x').addEventListener('click',function(){remove(t)});
    var sx=0,dx=0,down=false;
    el.addEventListener('pointerdown',function(e){if(e.target.closest('button'))return;down=true;sx=e.clientX;dx=0;el.setPointerCapture(e.pointerId);el.classList.add('drag')});
    el.addEventListener('pointermove',function(e){if(!down)return;dx=e.clientX-sx;el.style.setProperty('--dx',dx+'px');el.style.setProperty('--o',Math.max(.2,1-Math.abs(dx)/260))});
    var end=function(){if(!down)return;down=false;el.classList.remove('drag');if(Math.abs(dx)>90)remove(t,dx>0?1:-1);else{el.style.setProperty('--dx','0px');layout()}};
    el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
  }
  var last=performance.now();
  (function loop(now){var dt=now-last;last=now;if(!open)list.slice().forEach(function(t,i){if(i>0)return;t.left-=dt;t.el.style.setProperty('--left',Math.max(0,t.left/DUR).toFixed(3));if(t.left<=0)remove(t)});requestAnimationFrame(loop)})(last);
  zone.addEventListener('pointerenter',function(e){if(e.pointerType==='mouse'){open=true;layout()}},true);
  root.addEventListener('pointerover',function(e){if(e.pointerType==='mouse'&&!open){open=true;layout()}});
  root.addEventListener('pointerleave',function(e){if(e.pointerType==='mouse'){open=false;layout()}});
  return push;
})();

/* ═════════════════ 전역 클릭 위임 ═════════════════ */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-open],[data-go],[data-fav],[data-dept],[data-home],[data-viewmode],[data-add-here],[data-pin]');
  if(!t) return;
  if(t.hasAttribute('data-open')) showDetail(t.getAttribute('data-open'));
  else if(t.hasAttribute('data-go')){var a=byId(t.getAttribute('data-go'));if(a){recents=[a.id].concat(recents.filter(function(r){return r!==a.id})).slice(0,12);store.set('recents',recents);openUrl(a.url,a.title)}}
  else if(t.hasAttribute('data-fav')){
    var id=t.getAttribute('data-fav'),on=favs.indexOf(id)<0;
    favs=on?favs.concat(id):favs.filter(function(f){return f!==id}); store.set('favs',favs);
    document.querySelectorAll('[data-fav="'+id+'"]').forEach(function(b){b.setAttribute('aria-pressed',String(on));b.textContent=b.classList.contains('ibtn')?(on?'★':'☆'):(on?'★ 즐겨찾기됨':'☆ 즐겨찾기')});
    toast(on?'ok':'info',on?'즐겨찾기에 담았어요':'즐겨찾기에서 뺐어요',(byId(id)||{}).title);
  }
  else if(t.hasAttribute('data-dept')) go({v:'dept',d:t.getAttribute('data-dept')});
  else if(t.hasAttribute('data-home')) go({v:'home'});
  else if(t.hasAttribute('data-viewmode')){S.view=t.getAttribute('data-viewmode');store.set('viewmode',S.view);render()}
  else if(t.hasAttribute('data-add-here')) openAdd(t.getAttribute('data-add-here'));
  else if(t.hasAttribute('data-pin')){var m=S.menu[+t.getAttribute('data-pin')];if(!m.url){e.preventDefault();openUrl('',m.name)}}
});
document.getElementById('addBtn').addEventListener('click',function(){openAdd()});


/* ═════════════════ 첫 로딩 화면 (#256) ═════════════════
   start(): 실제 데이터를 기다리는 동안 88%까지 멈칫멈칫 차오름 · finish(): 100%까지 채운 뒤 위아래로 걷힘 */
var Loader=(function(){
  var root=document.getElementById('loader'), n=root.querySelector('.u256-n span'), msg=root.querySelector('.u256-msg'), cup=root.querySelector('.u256-cup'), pf=root.querySelector('.u256-pf');
  var rm=matchMedia('(prefers-reduced-motion: reduce)').matches, v=0, t=0, cap=88, done=null, stage=-1;
  var STAGES=[[0,'📋 출석 부르는 중…'],[28,'🏫 교실 문 여는 중…'],[56,'📚 업무 페이지 정리하는 중…'],[100,'🎉 준비 완료!']];
  function set(x){
    v=x; n.textContent=x; cup.style.setProperty('--lv',x+'%'); pf.style.setProperty('--pv',x+'%'); root.setAttribute('aria-valuenow',x);
    var k=0; for(var i=0;i<STAGES.length;i++) if(x>=STAGES[i][0]) k=i;
    if(k!==stage){stage=k;msg.innerHTML='<span>'+STAGES[k][1]+'</span>'}
  }
  // 실제 로딩처럼 고르지 않게: 잠깐 멈추기도 하고 몇 칸씩 뛰기도 합니다
  function step(){
    var lim=done?100:cap;
    if(v<lim){ set(Math.min(lim, v+(Math.random()<0.18?0:2+Math.floor(Math.random()*(v>80?4:9))))); }
    if(v>=100){ t=setTimeout(open,350); return; }
    t=setTimeout(step, done?28:(Math.random()<0.12?260:55));
  }
  function open(){
    root.classList.add('is-open');
    document.body.classList.add('reveal'); render();
    if(done) done();
    setTimeout(function(){root.classList.add('is-gone');root.setAttribute('aria-hidden','true')},950);
    setTimeout(function(){document.body.classList.remove('reveal')},2200);
  }
  return{
    start:function(who){
      if(who) document.getElementById('ldWho').textContent=who+' 선생님의 교무실을 준비하고 있어요';
      root.classList.remove('is-gone','is-open'); root.classList.add('is-on'); root.setAttribute('aria-hidden','false');
      set(0); clearTimeout(t); done=null;
      if(rm){set(cap);return}
      step();
    },
    finish:function(cb){
      done=cb||function(){};
      if(rm){set(100);open();return}
      clearTimeout(t); step();
    }
  };
})();

/* ═════════════════ 교직원 인증 (#062) ═════════════════ */
(function(){
  var gate=document.getElementById('gate'), root=gate.querySelector('.u062');
  var form=root.querySelector('.u062-login'), hi=root.querySelector('.u062-hi'), nameIn=document.getElementById('gName');
  var pwF=root.querySelector('.u062-pw'), pw=pwF.querySelector('input'), err=pwF.querySelector('.u062-err span');
  var eye=root.querySelector('.u062-eye'), caps=root.querySelector('.u062-caps'), go_=root.querySelector('.u062-go');
  var uid='u062'+Math.random().toString(36).slice(2,7), left=5, busy=false;
  root.querySelectorAll('.u062-login .u062-f').forEach(function(f,i){var inp=f.querySelector('input');if(!inp.id)inp.id=uid+i;f.querySelector('label').htmlFor=inp.id});
  err.id=uid+'e'; pw.setAttribute('aria-describedby',err.id);
  nameIn.value=S.me||'';
  eye.addEventListener('click',function(){var on=eye.getAttribute('aria-pressed')!=='true';eye.setAttribute('aria-pressed',String(on));eye.setAttribute('aria-label',on?'비밀번호 숨기기':'비밀번호 보기');pw.type=on?'text':'password'});
  pw.addEventListener('keyup',function(e){if(e.getModifierState)caps.classList.toggle('on',e.getModifierState('CapsLock'))});
  pw.addEventListener('input',function(){pwF.classList.remove('bad');pw.removeAttribute('aria-invalid')});
  function fail(msg){
    busy=false; go_.classList.remove('busy'); go_.removeAttribute('aria-label');
    left=Math.max(0,left-1);
    err.textContent=msg||(left?'비밀번호가 맞지 않아요 · '+left+'번 남았어요':'잠시 뒤 다시 시도해 주세요');
    pwF.classList.add('bad'); pw.setAttribute('aria-invalid','true');
    root.classList.remove('shake'); void root.offsetWidth; root.classList.add('shake'); pw.select();
  }
  function success(){
    go_.classList.remove('busy'); go_.classList.add('ok'); go_.setAttribute('aria-label','인증 성공');
    S.me=nameIn.value.trim()||S.me; store.set('me',S.me); syncMe();
    document.getElementById('hiTitle').textContent=(S.me?S.me+' 선생님,':'')+' 어서 오세요';
    root.querySelector('.u062-av').textContent=S.me?S.me.charAt(0):'율';
    setTimeout(function(){
      root.classList.add('is-in'); form.inert=true; hi.setAttribute('aria-hidden','false');
      setTimeout(function(){
        Loader.start(S.me);
        setTimeout(function(){gate.remove()},400);
        /* 실제 데이터 불러오기가 끝나면 100%까지 채우고 걷힘 (시안: 잠깐 기다린 척) */
        (API_URL?loadLive().then(boot):new Promise(function(r){setTimeout(r,1400)})).then(function(){Loader.finish()}).catch(function(){Loader.finish();toast('err','데이터를 불러오지 못했어요','새로고침해 주세요')});
      },900);
    },650);
  }
  onSubmit(form,function(e){
    e.preventDefault(); if(busy) return;
    if(!pw.value){fail('비밀번호를 입력해 주세요');left++;return}
    busy=true; go_.classList.add('busy'); go_.setAttribute('aria-label','확인하는 중');
    if(!API_URL){ setTimeout(success,900); return; }  /* 시안 모드: 아무 비밀번호나 통과 */
    fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'login',password:pw.value,name:nameIn.value.trim()})})
      .then(function(r){return r.json()})
      .then(function(j){if(!j.token)return fail(j.message);S.token=j.token;store.set('token',{t:j.token,exp:j.exp});success()})
      .catch(function(){fail('서버에 연결하지 못했어요')});
  });
  root.addEventListener('animationend',function(e){if(e.target===root)root.classList.remove('shake')});
  /* 저장된 인증이 유효하면 바로 입장 */
  var saved=store.get('token',null);
  var adm=store.get('admin',null); if(API_URL&&adm&&adm.exp>Date.now()&&saved&&saved.exp>Date.now()){S.staffToken=saved.t;S.role='admin'}
  if(API_URL&&saved&&saved.exp>Date.now()){S.token=S.role==='admin'?adm.t:saved.t;gate.remove();Loader.start(S.me);loadLive().then(boot).then(function(){Loader.finish()}).catch(function(){store.set('token',null);location.reload()})}
  setTimeout(function(){(S.me?pw:nameIn).focus()},300);
})();

/* ═════════════════ 시작 ═════════════════ */
function boot(){
  S.view=store.get('viewmode','cat'); syncMe(); buildRail(); window.__palette.refresh(); render();
}
S.me=store.get('me','');
if(!API_URL){loadDemo();boot()}
</script>
